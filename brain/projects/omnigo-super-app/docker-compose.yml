version: '3.8'
services:
  postgres-primary:
    image: postgres:15-alpine
    container_name: postgres-primary
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
      POSTGRES_DB: omnigo
    ports:
      - "5432:5432"
    command: ["postgres", "-c", "wal_level=logical", "-c", "max_replication_slots=10", "-c", "max_wal_senders=10"]
    volumes:
      - pgdata:/var/lib/postgresql/data

  kafka-cluster:
    image: confluentinc/cp-kafka:7.4.0
    container_name: kafka-cluster
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka-cluster:29092,PLAINTEXT_HOST://localhost:9092'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka-cluster:29093'
      KAFKA_LISTENERS: 'PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093,PLAINTEXT_HOST://0.0.0.0:9092'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_LOG_DIRS: '/tmp/kraft-combined-logs'
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'

  debezium-connect:
    image: debezium/connect:2.3
    container_name: debezium-connect
    ports:
      - "8083:8083"
    depends_on:
      - kafka-cluster
      - postgres-primary
    environment:
      BOOTSTRAP_SERVERS: kafka-cluster:29092
      GROUP_ID: omnigo-cdc-group
      CONFIG_STORAGE_TOPIC: omnigo-cdc-config
      OFFSET_STORAGE_TOPIC: omnigo-cdc-offsets
      STATUS_STORAGE_TOPIC: omnigo-cdc-status

  neo4j-graph:
    image: neo4j:5.9-community
    container_name: neo4j-graph
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-changeme_neo4j}
    volumes:
      - neo4jdata:/data

volumes:
  pgdata:
  neo4jdata:
