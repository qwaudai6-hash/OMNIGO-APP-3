name: OMNIGO Remote Map & CI/CD Pipeline

on:
  push:
    branches:
      - main
    paths:
      - 'backend/go-services/internal/map/**'
      - 'backend/go-services/cmd/map-service/**'
      - 'infrastructure/docker/openmaptiles/**'
      - 'scripts/sync_map_data.sh'
      - '.github/workflows/map-data-pipeline.yml'
  workflow_dispatch:
    inputs:
      force_map_update:
        description: 'Force re-download of map dataset (true/false)'
        required: false
        default: 'false'
      map_region:
        description: 'Target map region (e.g. pakistan, south-asia)'
        required: false
        default: 'pakistan'

jobs:
  map-sync-and-build:
    name: Sync Map Data & Build Map Services
    # Runs on remote high-speed VPS self-hosted runner (never on local PC)
    runs-on: [self-hosted, omnigo-vps]
    env:
      MAP_STORAGE_DIR: /opt/omnigo/map-data
      MAP_REGION: ${{ github.event.inputs.map_region || 'pakistan' }}
      FORCE_MAP_UPDATE: ${{ github.event.inputs.force_map_update || 'false' }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Inspect & Sync Map Dataset (Resumable + Cached)
        run: |
          chmod +x ./scripts/sync_map_data.sh
          ./scripts/sync_map_data.sh

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push Map Service Image
        uses: docker/build-push-action@v6
        with:
          context: backend/go-services
          file: backend/go-services/Dockerfile
          build-args: |
            SERVICE=map-service
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/map-service:latest
            ghcr.io/${{ github.repository }}/map-service:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy & Update Railway Services
        if: env.RAILWAY_TOKEN != ''
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          if command -v railway >/dev/null 2>&1; then
            echo "Triggering Railway deployment for map-service..."
            railway up --service map-service --detach
          else
            echo "Railway CLI not found on runner, skipping direct CLI deployment."
          fi

      - name: Verify Live Endpoints
        if: env.RAILWAY_PUBLIC_URL != ''
        env:
          RAILWAY_PUBLIC_URL: ${{ secrets.RAILWAY_PUBLIC_URL }}
        run: |
          chmod +x ./scripts/verify_railway_deployment.sh
          ./scripts/verify_railway_deployment.sh
