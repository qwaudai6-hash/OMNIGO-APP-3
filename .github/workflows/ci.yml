name: OMNIGO CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CI_ENVIRONMENT: true

jobs:
  # ── Go Services ─────────────────────────────────────────────
  go-build:
    name: Go Build & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/go-services
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go-services/go.mod
          cache-dependency-path: backend/go-services/go.sum

      - name: Download dependencies
        run: go mod download

      - name: Build all services
        run: go build ./...

      - name: Run tests
        run: go test ./... -v -count=1 -short
        env:
          JWT_SECRET_KEY: "dummy_jwt_secret_key_for_testing_in_ci_12345"
          HMAC_SECRET: "dummy_secret_for_testing"
          JAZZCASH_SALT: "dummy_jazzcash_salt"
          EASYPAISA_SALT: "dummy_easypaisa_salt"
          DATABASE_URL: "postgres://omnigo_user:omnigo_password@localhost:5433/omnigo_db"
          REDIS_ADDRS: "localhost:6379"

      - name: Run vet
        run: go vet ./...

  # ── Flutter App ─────────────────────────────────────────────
  flutter-ci:
    name: Flutter CI — Analyze, Test, Android Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/omnigo_app
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze code
        run: flutter analyze --no-pub --no-fatal-infos --no-fatal-warnings

      - name: Run tests
        run: flutter test --no-pub

      - name: Build Android APK (smoke)
        env:
          API_HOST: ${{ vars.FLUTTER_API_HOST }}
          STRIPE_KEY: ${{ vars.STRIPE_PUBLISHABLE_KEY }}
        run: |
          flutter build apk --debug \
            --android-skip-build-dependency-validation \
            --dart-define=API_HOST="${API_HOST:-omnigo-app-3-production.up.railway.app}" \
            --dart-define=STRIPE_PUBLISHABLE_KEY="${STRIPE_KEY:-pk_test_placeholder}"

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: omnigo-app-debug-apk
          path: |
            frontend/omnigo_app/build/app/outputs/flutter-apk/*.apk
            **/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  # ── Security Scan ───────────────────────────────────────────
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: false
        continue-on-error: false

  # ── Docker Smoke Builds (every PR and push) ─────────────────
  docker-smoke-go:
    name: Docker Smoke Build — Go services
    runs-on: ubuntu-latest
    needs: [go-build]
    strategy:
      fail-fast: false
      matrix:
        service: [
          admin-service,
          analytics-worker,
          auth-service,
          delivery-gig-service,
          gateway,
          graph-sync-worker,
          location-sync-worker,
          map-service,
          monolith,
          order-service,
          payment-orchestrator,
          product-service,
          ride-service,
          vendor-store-service,
          websocket-gateway
        ]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Smoke build image
        uses: docker/build-push-action@v6
        with:
          context: backend/go-services
          file: backend/go-services/Dockerfile
          build-args: SERVICE=${{ matrix.service }}
          push: false
          load: true
          tags: omnigo/${{ matrix.service }}:smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max

  docker-smoke-other:
    name: Docker Smoke Build — Node/Python
    runs-on: ubuntu-latest
    needs: [flutter-ci]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Smoke build notification-service
        uses: docker/build-push-action@v6
        with:
          context: backend/node-services/notification-service
          file: backend/node-services/notification-service/Dockerfile
          push: false
          load: true
          tags: omnigo/notification-service:smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke build email-service
        uses: docker/build-push-action@v6
        with:
          context: backend/node-services/email-service
          file: backend/node-services/email-service/Dockerfile
          push: false
          load: true
          tags: omnigo/email-service:smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke build sms-service
        uses: docker/build-push-action@v6
        with:
          context: backend/node-services/sms-service
          file: backend/node-services/sms-service/Dockerfile
          push: false
          load: true
          tags: omnigo/sms-service:smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke build ai-engine
        uses: docker/build-push-action@v6
        with:
          context: backend/python-services/ai-engine
          file: backend/python-services/ai-engine/Dockerfile
          push: false
          load: true
          tags: omnigo/ai-engine:smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke build tigerbeetle
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infrastructure/docker/dockerfiles/tigerbeetle.Dockerfile
          push: false
          load: true
          tags: omnigo/tigerbeetle:smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke build osrm-backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infrastructure/docker/dockerfiles/osrm.Dockerfile
          push: false
          load: true
          tags: omnigo/osrm-backend:smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke build tileserver-gl
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infrastructure/docker/dockerfiles/tileserver.Dockerfile
          push: false
          load: true
          tags: omnigo/tileserver-gl:smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke build photon
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infrastructure/docker/dockerfiles/photon.Dockerfile
          push: false
          load: true
          tags: omnigo/photon:smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Publish Images (push only) ──────────────────────────────
  publish-images:
    name: Publish Images
    runs-on: ubuntu-latest
    needs: [go-build, flutter-ci, docker-smoke-go, docker-smoke-other]
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - context: backend/go-services
            file: backend/go-services/Dockerfile
            build_args: SERVICE=admin-service
            name: admin-service
          - context: backend/go-services
            file: backend/go-services/Dockerfile
            build_args: SERVICE=analytics-worker
            name: analytics-worker
          - context: backend/go-services
            file: backend/go-services/Dockerfile
            build_args: SERVICE=auth-service
            name: auth-service
          - context: backend/go-services
            file: backend/go-services/Dockerfile
            build_args: SERVICE=delivery-gig-service
            name: delivery-gig-service
          - context: backend/go-services
            file: backend/go-services/Dockerfile
            build_args: SERVICE=graph-sync-worker
            name: graph-sync-worker
          - context: backend/go-services
            file: backend/go-services/Dockerfile
            build_args: SERVICE=location-sync-worker
            name: location-sync-worker
          - context: backend/go-services
            file: backend/go-services/Dockerfile
            build_args: SERVICE=map-service
            name: map-service
          - context: backend/go-services
            file: backend/go-services/Dockerfile
            build_args: SERVICE=order-service
            name: order-service
          - context: backend/go-services
            file: backend/go-services/Dockerfile
            build_args: SERVICE=payment-orchestrator
            name: payment-orchestrator
          - context: backend/go-services
            file: backend/go-services/Dockerfile
            build_args: SERVICE=product-service
            name: product-service
          - context: backend/go-services
            file: backend/go-services/Dockerfile
            build_args: SERVICE=ride-service
            name: ride-service
          - context: backend/go-services
            file: backend/go-services/Dockerfile
            build_args: SERVICE=vendor-store-service
            name: vendor-store-service
          - context: backend/go-services
            file: backend/go-services/Dockerfile
            build_args: SERVICE=gateway
            name: gateway
          - context: backend/go-services
            file: backend/go-services/Dockerfile
            build_args: SERVICE=monolith
            name: monolith
          - context: backend/go-services
            file: backend/go-services/Dockerfile
            build_args: SERVICE=websocket-gateway
            name: websocket-gateway
          - context: backend/node-services/notification-service
            file: backend/node-services/notification-service/Dockerfile
            name: notification-service
          - context: backend/node-services/email-service
            file: backend/node-services/email-service/Dockerfile
            name: email-service
          - context: backend/node-services/sms-service
            file: backend/node-services/sms-service/Dockerfile
            name: sms-service
          - context: backend/python-services/ai-engine
            file: backend/python-services/ai-engine/Dockerfile
            name: ai-engine
          - context: .
            file: infrastructure/docker/dockerfiles/tigerbeetle.Dockerfile
            name: tigerbeetle
          - context: .
            file: infrastructure/docker/dockerfiles/osrm.Dockerfile
            name: osrm-backend
          - context: .
            file: infrastructure/docker/dockerfiles/tileserver.Dockerfile
            name: tileserver-gl
          - context: .
            file: infrastructure/docker/dockerfiles/photon.Dockerfile
            name: photon
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub (Optional)
        if: env.DOCKERHUB_USER != '' && env.DOCKERHUB_PASS != ''
        env:
          DOCKERHUB_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_PASS: ${{ secrets.DOCKERHUB_TOKEN }}
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USER }}
          password: ${{ env.DOCKERHUB_PASS }}

      - name: Set lowercase owner name
        run: echo "OWNER_LC=${GITHUB_REPOSITORY_OWNER,,}" >> ${GITHUB_ENV}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          build-args: ${{ matrix.build_args }}
          push: true
          tags: |
            ghcr.io/${{ env.OWNER_LC }}/omnigo-${{ matrix.name }}:${{ github.sha }}
            ghcr.io/${{ env.OWNER_LC }}/omnigo-${{ matrix.name }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Deploy to Railway (push only) ───────────────────────────
  deploy-railway:
    name: Deploy to Railway
    runs-on: ubuntu-latest
    needs: [publish-images]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      RAILWAY_PUBLIC_URL: ${{ secrets.RAILWAY_PUBLIC_URL }}
    steps:
      - uses: actions/checkout@v4

      - name: Deploy Monolith & Microservices via Railway CLI
        if: env.RAILWAY_TOKEN != ''
        run: |
          npm install -g @railway/cli
          railway up --detach

      - name: Verify Live Endpoints
        if: env.RAILWAY_PUBLIC_URL != ''
        run: |
          chmod +x ./scripts/verify_railway_deployment.sh
          ./scripts/verify_railway_deployment.sh
