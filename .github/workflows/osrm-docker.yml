name: Build and Push OSRM Docker Image

on:
  workflow_dispatch:
    inputs:
      map_url:
        description: 'URL of the map to download (.osm.pbf format)'
        required: true
        default: 'http://download.geofabrik.de/asia/pakistan-latest.osm.pbf'

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          
      - name: Build and Push to Docker Hub
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./infrastructure/docker/dockerfiles/osrm.Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/omnigo-osrm-pakistan:latest
          build-args: |
            MAP_URL=${{ github.event.inputs.map_url }}
          cache-from: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/omnigo-osrm-pakistan:buildcache
          cache-to: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/omnigo-osrm-pakistan:buildcache,mode=max
