events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    # Rate limiting zone (10 requests per second per IP)
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

    # Upstreams (Assuming services will be added to docker-compose later)
    # upstream auth_service { server auth-service:8080; }
    # upstream product_service { server product-service:8080; }
    # upstream ws_service { server websocket-service:8081; }

    server {
        listen 80;
        server_name localhost;

        location / {
            root   /usr/share/nginx/html;
            index  index.html index.htm;
        }

        # Example API Routing
        # location /api/v1/auth/ {
        #     limit_req zone=api_limit burst=20 nodelay;
        #     proxy_pass http://auth_service/;
        #     proxy_set_header Host $host;
        #     proxy_set_header X-Real-IP $remote_addr;
        # }

        # Example WebSocket Routing
        # location /ws/ {
        #     proxy_pass http://ws_service/;
        #     proxy_http_version 1.1;
        #     proxy_set_header Upgrade $http_upgrade;
        #     proxy_set_header Connection "Upgrade";
        #     proxy_set_header Host $host;
        # }
    }
}
