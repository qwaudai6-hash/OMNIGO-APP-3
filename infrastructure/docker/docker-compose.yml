services:
  omnigo-postgres:
    image: postgis/postgis:15-3.3-alpine
    container_name: omnigo-postgres
    environment:
      POSTGRES_USER: omnigo_user
      POSTGRES_PASSWORD: omnigo_password
      POSTGRES_DB: omnigo_db
    ports:
      - 5433:5432
    command:
      - postgres
      - -c
      - wal_level=logical
      - -c
      - max_replication_slots=10
      - -c
      - max_wal_senders=10
      - -c
      - max_connections=300
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U omnigo_user -d omnigo_db
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '2'
    restart: always
  redis-node-1:
    image: redis:7.0-alpine
    container_name: redis-node-1
    network_mode: host
    command: redis-server --port 6379 --requirepass "${REDIS_PASSWORD:-changeme_redis_pw}" --cluster-enabled yes --cluster-config-file
      /tmp/nodes-1.conf --cluster-node-timeout 5000 --appendonly yes --bind 127.0.0.1
    healthcheck:
      test:
        - CMD
        - redis-cli
        - -p
        - '6379'
        - ping
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1'
    restart: always
  redis-node-2:
    image: redis:7.0-alpine
    container_name: redis-node-2
    network_mode: host
    command: redis-server --port 6380 --cluster-enabled yes --cluster-config-file
      /tmp/nodes-2.conf --cluster-node-timeout 5000 --appendonly yes --bind 127.0.0.1
    healthcheck:
      test:
        - CMD
        - redis-cli
        - -p
        - '6380'
        - ping
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1'
    restart: always
  redis-node-3:
    image: redis:7.0-alpine
    container_name: redis-node-3
    network_mode: host
    command: redis-server --port 6381 --cluster-enabled yes --cluster-config-file
      /tmp/nodes-3.conf --cluster-node-timeout 5000 --appendonly yes --bind 127.0.0.1
    healthcheck:
      test:
        - CMD
        - redis-cli
        - -p
        - '6381'
        - ping
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1'
    restart: always
  redis-cluster-init:
    image: redis:7.0-alpine
    container_name: redis-cluster-init
    network_mode: host
    depends_on:
      redis-node-1:
        condition: service_healthy
      redis-node-2:
        condition: service_healthy
      redis-node-3:
        condition: service_healthy
    command: "sh -c \"sleep 3;\n       redis-cli --cluster create 127.0.0.1:6379 127.0.0.1:6380\
      \ 127.0.0.1:6381 --cluster-yes\"\n"
  kafka-cluster:
    image: confluentinc/cp-kafka:7.4.0
    container_name: kafka-cluster
    ports:
      - 9092:9092
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-cluster:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-cluster:29093
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    healthcheck:
      test:
        - CMD-SHELL
        - kafka-broker-api-versions --bootstrap-server localhost:9092 || exit 1
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: '2'
    restart: always
  debezium-connect:
    image: debezium/connect:2.3
    container_name: debezium-connect
    ports:
      - 8083:8083
    depends_on:
      kafka-cluster:
        condition: service_healthy
      omnigo-postgres:
        condition: service_healthy
    environment:
      BOOTSTRAP_SERVERS: kafka-cluster:29092
      GROUP_ID: omnigo-cdc-group
      CONFIG_STORAGE_TOPIC: omnigo-cdc-config
      OFFSET_STORAGE_TOPIC: omnigo-cdc-offsets
      STATUS_STORAGE_TOPIC: omnigo-cdc-status
    healthcheck:
      test:
        - CMD-SHELL
        - curl -sf http://localhost:8083/connectors || exit 1
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1'
    restart: always
  neo4j-graph:
    image: neo4j:5.9-community
    container_name: neo4j-graph
    ports:
      - 7474:7474
      - 7687:7687
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-changeme_neo4j}
    volumes:
      - neo4jdata:/data
    healthcheck:
      test:
        - CMD-SHELL
        - wget -q --spider http://localhost:7474 || exit 1
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '2'
    restart: always
  osrm:
    image: osrm/osrm-backend:latest
    container_name: omnigo-osrm
    ports:
      - 5000:5000
    command: "bash -c \"\n  export MAP_FILE='pakistan-latest.osm.pbf'\n  export MAP_BASE='pakistan-latest.osrm'\n\
      \n  if [ ! -f /data/$$MAP_BASE.partition ]; then\n    if [ ! -f /data/$$MAP_FILE\
      \ ]; then echo 'Downloading Pakistan OSM extract...'; wget -q https://download.geofabrik.de/asia/pakistan-latest.osm.pbf -O /data/$$MAP_FILE; fi &&\n    osrm-extract -p /opt/car.lua\
      \ /data/$$MAP_FILE &&\n    osrm-partition /data/$$MAP_BASE &&\n    osrm-customize\
      \ /data/$$MAP_BASE;\n  fi &&\n  osrm-routed --algorithm mld --bind 0.0.0.0 --port\
      \ 5000 /data/$$MAP_BASE\n\"\n"
    volumes:
      - osrmdata:/data
    healthcheck:
      test:
        - CMD-SHELL
        - wget -q --spider http://localhost:5000/ || exit 1
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '2'
    restart: always
  osrm-us:
    image: osrm/osrm-backend:latest
    container_name: omnigo-osrm-us
    ports:
      - 5001:5000
    command: "bash -c \"\n  export MAP_FILE='us-latest.osm.pbf'\n  export MAP_BASE='us-latest.osrm'\n\
      \n  if [ ! -f /data/$$MAP_BASE.hsgr ]; then\n    if [ ! -f /data/$$MAP_FILE\
      \ ]; then echo 'Missing PBF file'; exit 1; fi &&\n    osrm-extract -p /opt/car.lua\
      \ /data/$$MAP_FILE &&\n    osrm-partition /data/$$MAP_BASE &&\n    osrm-customize\
      \ /data/$$MAP_BASE;\n  fi &&\n  osrm-routed --algorithm mld --bind 0.0.0.0 --port\
      \ 5000 /data/$$MAP_BASE\n\"\n"
    volumes:
      - osrmdata-us:/data
    healthcheck:
      test:
        - CMD-SHELL
        - wget -q --spider http://localhost:5000/ || exit 1
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: '2'
    restart: always
  osrm-ca:
    image: osrm/osrm-backend:latest
    container_name: omnigo-osrm-ca
    ports:
      - 5002:5000
    command: "bash -c \"\n  export MAP_FILE='canada-latest.osm.pbf'\n  export MAP_BASE='canada-latest.osrm'\n\
      \n  if [ ! -f /data/$$MAP_BASE.hsgr ]; then\n    if [ ! -f /data/$$MAP_FILE\
      \ ]; then echo 'Missing PBF file'; exit 1; fi &&\n    osrm-extract -p /opt/car.lua\
      \ /data/$$MAP_FILE &&\n    osrm-partition /data/$$MAP_BASE &&\n    osrm-customize\
      \ /data/$$MAP_BASE;\n  fi &&\n  osrm-routed --algorithm mld --bind 0.0.0.0 --port\
      \ 5000 /data/$$MAP_BASE\n\"\n"
    volumes:
      - osrmdata-ca:/data
    healthcheck:
      test:
        - CMD-SHELL
        - wget -q --spider http://localhost:5000/ || exit 1
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 3G
          cpus: '2'
    restart: always
  notification-service:
    build:
      context: ../../backend/node-services/notification-service
      dockerfile: Dockerfile
    container_name: omnigo-notification-service
    ports:
      - 8089:8089
    environment:
      - KAFKA_BROKERS=kafka-cluster:29092
      - DB_DSN=postgres://omnigo_user:omnigo_password@omnigo-postgres:5432/omnigo_db
      - REDIS_ADDRS=redis-node-1:6379,redis-node-2:6380,redis-node-3:6381
      - FCM_SERVICE_ACCOUNT_PATH=/run/secrets/fcm_service_account.json
    depends_on:
      kafka-cluster:
        condition: service_healthy
      omnigo-postgres:
        condition: service_healthy
      redis-node-1:
        condition: service_healthy
    volumes:
      - ../../secrets/fcm_service_account.json:/run/secrets/fcm_service_account.json:ro
    healthcheck:
      test:
        - CMD-SHELL
        - wget -q --spider http://localhost:8089/health || exit 1
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'
    restart: always
  email-service:
    build:
      context: ../../backend/node-services/email-service
      dockerfile: Dockerfile
    container_name: omnigo-email-service
    ports:
      - 8090:8090
    environment:
      - KAFKA_BROKERS=kafka-cluster:29092
      - DB_DSN=postgres://omnigo_user:omnigo_password@omnigo-postgres:5432/omnigo_db
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
    depends_on:
      kafka-cluster:
        condition: service_healthy
      omnigo-postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - wget -q --spider http://localhost:8090/health || exit 1
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'
    restart: always
  sms-service:
    build:
      context: ../../backend/node-services/sms-service
      dockerfile: Dockerfile
    container_name: omnigo-sms-service
    ports:
      - 8091:8091
    environment:
      - KAFKA_BROKERS=kafka-cluster:29092
      - DB_DSN=postgres://omnigo_user:omnigo_password@omnigo-postgres:5432/omnigo_db
      - SMS_GATEWAY_TYPE=${SMS_GATEWAY_TYPE:-}
      - SMS_GATEWAY_URL=${SMS_GATEWAY_URL:-}
      - SMS_GATEWAY_USERNAME=${SMS_GATEWAY_USERNAME:-}
      - SMS_GATEWAY_PASSWORD=${SMS_GATEWAY_PASSWORD:-}
      - SMS_GATEWAY_SENDER=${SMS_GATEWAY_SENDER:-OMNIGO}
      - TWILIO_ACCOUNT_SID=${TWILIO_ACCOUNT_SID:-}
      - TWILIO_AUTH_TOKEN=${TWILIO_AUTH_TOKEN:-}
      - TWILIO_PHONE_NUMBER=${TWILIO_PHONE_NUMBER:-}
    depends_on:
      kafka-cluster:
        condition: service_healthy
      omnigo-postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - wget -q --spider http://localhost:8091/health || exit 1
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'
    restart: always
  ai-engine:
    build:
      context: ../../backend/python-services/ai-engine
      dockerfile: Dockerfile
    container_name: omnigo-ai-engine
    ports:
      - 8086:8086
    environment:
      - PORT=8086
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '2'
    restart: always
  graph-sync-worker:
    build:
      context: ../../backend/go-services
      dockerfile: Dockerfile
      args:
        SERVICE: graph-sync-worker
    container_name: omnigo-graph-sync-worker
    environment:
      - DB_WRITER_DSN=postgres://omnigo_user:${POSTGRES_PASSWORD:-omnigo_password}@omnigo-postgres:5432/omnigo_db?sslmode=disable
      - DB_READER_DSN=postgres://omnigo_user:${POSTGRES_PASSWORD:-omnigo_password}@omnigo-postgres:5432/omnigo_db?sslmode=disable
      - REDIS_ADDRS=redis-node-1:6379,redis-node-2:6380,redis-node-3:6381
      - KAFKA_BROKERS=kafka-cluster:29092
      - NEO4J_URI=neo4j://neo4j-graph:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:-omnigo123}
    depends_on:
      kafka-cluster:
        condition: service_healthy
      neo4j-graph:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'
    restart: always
  location-sync-worker:
    build:
      context: ../../backend/go-services
      dockerfile: Dockerfile
      args:
        SERVICE: location-sync-worker
    container_name: omnigo-location-sync-worker
    environment:
      - DB_WRITER_DSN=postgres://omnigo_user:${POSTGRES_PASSWORD:-omnigo_password}@omnigo-postgres:5432/omnigo_db?sslmode=disable
      - DB_READER_DSN=postgres://omnigo_user:${POSTGRES_PASSWORD:-omnigo_password}@omnigo-postgres:5432/omnigo_db?sslmode=disable
      - REDIS_ADDRS=redis-node-1:6379,redis-node-2:6380,redis-node-3:6381
      - KAFKA_BROKERS=kafka-cluster:29092
    depends_on:
      omnigo-postgres:
        condition: service_healthy
      redis-node-1:
        condition: service_healthy
      kafka-cluster:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'
    restart: always
  analytics-worker:
    build:
      context: ../../backend/go-services
      dockerfile: Dockerfile
      args:
        SERVICE: analytics-worker
    container_name: omnigo-analytics-worker
    environment:
      - CLICKHOUSE_ADDR=clickhouse:9100
      - KAFKA_BROKERS=kafka-cluster:29092
    depends_on:
      clickhouse:
        condition: service_started
      kafka-cluster:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'
    restart: always
  api-gateway:
    image: kong:latest
    container_name: omnigo-api-gateway
    environment:
      - KONG_DATABASE=off
      - KONG_DECLARATIVE_CONFIG=/usr/local/kong/declarative/kong.yml
      - KONG_PROXY_ACCESS_LOG=/dev/stdout
      - KONG_ADMIN_ACCESS_LOG=/dev/stdout
      - KONG_PROXY_ERROR_LOG=/dev/stderr
      - KONG_ADMIN_ERROR_LOG=/dev/stderr
      - KONG_ADMIN_LISTEN=127.0.0.1:8001
    ports:
      - 8001:8001
    volumes:
      - ../kong/kong.yml:/usr/local/kong/declarative/kong.yml:ro
    healthcheck:
      test:
        - CMD-SHELL
        - wget -q --spider http://localhost:8001/status || exit 1
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1'
    restart: always
  meilisearch:
    image: getmeili/meilisearch:v1.7
    container_name: omnigo-meilisearch
    ports:
      - 7700:7700
    environment:
      - MEILI_ENV=development
      - MEILI_MASTER_KEY=${MEILISEARCH_MASTER_KEY:-omnigo_meili_secret}
    volumes:
      - meilidata:/meili_data
    healthcheck:
      test:
        - CMD-SHELL
        - wget -q --spider http://localhost:7700/health || exit 1
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1'
    restart: always
  jaeger:
    image: jaegertracing/all-in-one:1.56
    container_name: omnigo-jaeger
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    ports:
      - 16686:16686
      - 4317:4317
      - 4318:4318
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1'
    restart: always
  clickhouse:
    image: clickhouse/clickhouse-server:24.3
    container_name: omnigo-clickhouse
    ports:
      - 8123:8123
      - 9100:9000
    volumes:
      - clickhousedata:/var/lib/clickhouse
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '1'
    restart: always
  tigerbeetle:
    image: ghcr.io/tigerbeetle/tigerbeetle:latest
    container_name: omnigo-tigerbeetle
    ports:
      - 3000:3000
    volumes:
      - tigerbeetledata:/data
    command: 'sh -c "if [ ! -f /data/0_0.tigerbeetle ]; then ./tigerbeetle format
      --cluster=0 --replica=0 --replica-count=1 /data/0_0.tigerbeetle; fi && ./tigerbeetle
      start --addresses=0.0.0.0:3000 /data/0_0.tigerbeetle"

      '
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1'
    restart: always
  minio:
    image: minio/minio:latest
    container_name: omnigo-minio
    ports:
      - 9000:9000
      - 9001:9001
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin}
    volumes:
      - miniodata:/data
    command: server /data --console-address ':9001'
    healthcheck:
      test:
        - CMD-SHELL
        - curl -f http://localhost:9000/minio/health/live || exit 1
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
    restart: always
  map-service:
    build:
      context: ../../backend/go-services
      dockerfile: Dockerfile
      args:
        SERVICE: map-service
    container_name: omnigo-map-service
    ports:
      - 9010:9010
    env_file:
      - ../../.env
    environment:
      - PORT=9010
      - MAPLIBRE_API_KEY=${MAPLIBRE_API_KEY:-}
      - MAPLIBRE_STYLE_URL=${MAPLIBRE_STYLE_URL:-}
      - PHOTON_URL=http://omnigo-photon:2322
      - TILESERVER_GL_URL=http://omnigo-tileserver-gl:8080
    healthcheck:
      test:
        - CMD-SHELL
        - wget -q --spider http://localhost:9010/health || exit 1
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'
    restart: always
  photon:
    # Photon is an open-source geocoder built on OpenStreetMap data.
    # It powers the in-house `/api/v1/geocoding/*` and `/api/v1/map/reverse`
    # endpoints. No Nominatim cloud dependency — all geocoding is local.
    image: hotosm/photon:0.6.0
    container_name: omnigo-photon
    ports:
      - 2322:2322
    environment:
      - PHOTON_OPENSEARCH_HOST=omnigo-photon-search
      - PHOTON_LANGUAGE=en
    volumes:
      - photon-data:/photon/data
    healthcheck:
      test:
        - CMD-SHELL
        - wget -q --spider http://localhost:2322/api || exit 1
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 1.5G
          cpus: '1.5'
    restart: always
  photon-search:
    # OpenSearch backing store for Photon. Single-node for dev; shard
    # for production via `cluster.healthy` healthcheck.
    image: opensearchproject/opensearch:2.11.0
    container_name: omnigo-photon-search
    environment:
      - cluster.name=photon-os
      - node.name=photon-1
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - "OPENSEARCH_JAVA_OPTS=-Xms1g -Xmx1g"
      - "# MEDIUM-21: TLS+auth demo config; flip to true ONLY behind a private network
      DISABLE_SECURITY_PLUGIN=${OPENSEARCH_DISABLE_SECURITY:-false}"
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - photon-search-data:/usr/share/opensearch/data
    healthcheck:
      test:
        - CMD-SHELL
        - curl -sf http://localhost:9200/_cluster/health || exit 1
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 90s
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '1.5'
    restart: always
  tileserver-gl:
    # Vector tile server. Serves OpenMapTiles MBTiles + the MapLibre
    # style.json. Replaces the MapTiler cloud dependency once the
    # OpenMapTiles dataset has been generated and mounted.
    image: maptiler/tileserver-gl:latest
    container_name: omnigo-tileserver-gl
    ports:
      - 8080:8080
    volumes:
      - ./openmaptiles/config.json:/data/config.json:ro
      - tileserver-data:/data
    environment:
      - ESLINT_NO_DEV_ERRORS=true
    healthcheck:
      test:
        - CMD-SHELL
        - wget -q --spider http://localhost:8080/health || exit 1
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '2'
    restart: always
  monolith:
    build:
      context: ../../backend/go-services
      dockerfile: Dockerfile
      args:
        SERVICE: monolith
    container_name: omnigo-monolith
    ports:
      - 8000:8000
    env_file:
      - ../../.env
    environment:
      - DB_WRITER_DSN=postgres://omnigo_user:${POSTGRES_PASSWORD:-omnigo_password}@omnigo-postgres:5432/omnigo_db?sslmode=disable
      - DB_READER_DSN=postgres://omnigo_user:${POSTGRES_PASSWORD:-omnigo_password}@omnigo-postgres:5432/omnigo_db?sslmode=disable
      - REDIS_ADDRS=redis-node-1:6379,redis-node-2:6380,redis-node-3:6381
      - KAFKA_BROKERS=kafka-cluster:29092
      - MEILISEARCH_HOST=http://omnigo-meilisearch:7700
      - NEO4J_URI=neo4j://neo4j-graph:7687
      - NEO4J_USER=neo4j
      - OSRM_URL=http://omnigo-osrm:5000
      - TIGERBEETLE_ADDR=tigerbeetle:3000
      - S3_ENDPOINT=http://omnigo-minio:9000
      - S3_ACCESS_KEY=${S3_ACCESS_KEY:-minioadmin}
      - S3_SECRET_KEY=${S3_SECRET_KEY:-minioadmin}
      - S3_BUCKET=${S3_BUCKET:-omnigo-uploads}
      - S3_REGION=${S3_REGION:-us-east-1}
      - S3_USE_PATH_STYLE=true
      - S3_PUBLIC_URL=http://localhost:9000/${S3_BUCKET:-omnigo-uploads}
    depends_on:
      omnigo-postgres:
        condition: service_healthy
      redis-node-1:
        condition: service_healthy
      kafka-cluster:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - wget -q --spider http://localhost:8000/health || exit 1
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1'
    restart: always
volumes:
  pgdata: null
  neo4jdata: null
  osrmdata: null
  osrmdata-us: null
  osrmdata-ca: null
  meilidata: null
  clickhousedata: null
  tigerbeetledata: null
  miniodata: null
  photon-data: null
  photon-search-data: null
  tileserver-data: null
