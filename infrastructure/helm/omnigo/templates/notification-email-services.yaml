    metadata:
      labels:
        app.kubernetes.io/name: {{ include "omnigo.name" . }}-email-service
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      containers:
        - name: email-service
          image: "{{ .Values.services.emailService.image }}"
          imagePullPolicy: IfNotPresent
          env:
            - name: PORT
              value: "8090"
            - name: KAFKA_BROKERS
              value: "{{ .Values.global.kafka.brokers }}"
          ports:
            - containerPort: 8090
