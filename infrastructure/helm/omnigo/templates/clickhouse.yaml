{{- if .Values.clickhouse.enabled -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "omnigo.fullname" . }}-clickhouse
  labels:
    {{- include "omnigo.labels" . }}
spec:
  ports:
    - name: client
      port: 9000
      targetPort: 9000
    - name: http
      port: 8123
      targetPort: 8123
  selector:
    app.kubernetes.io/name: {{ include "omnigo.name" . }}-clickhouse
    app.kubernetes.io/instance: {{ .Release.Name }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "omnigo.fullname" . }}-clickhouse
  labels:
    {{- include "omnigo.labels" . }}
spec:
  replicas: {{ .Values.clickhouse.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "omnigo.name" . }}-clickhouse
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "omnigo.name" . }}-clickhouse
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      containers:
        - name: clickhouse
          image: "{{ .Values.clickhouse.image }}"
          ports:
            - containerPort: 9000
              name: client
            - containerPort: 8123
              name: http
          volumeMounts:
            - name: chdata
              mountPath: /var/lib/clickhouse
      volumes:
        - name: chdata
          emptyDir: {}
{{- end }}
